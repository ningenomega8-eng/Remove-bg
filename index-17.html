<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoroom Tools</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#272b35;--txt:#e8eaf0;--mut:#8b91a1;--acc:#6c5ce7;--acc2:#8d7ffb;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font-weight:600;cursor:pointer}
  .tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--mut);cursor:pointer}
  .drop.over{border-color:var(--acc);color:var(--txt)}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input[type=text],select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f1115;color:var(--txt);font:inherit}
  input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
  input[type=range]{width:100%}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--txt);font-size:14px}
  .hide{display:none!important}
  button.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  button.go:disabled{opacity:.5;cursor:wait}
  a.dl{display:block;text-align:center;padding:12px;border-radius:10px;background:#00b894;color:#fff;font-weight:700;text-decoration:none;margin-top:10px}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.cmp{grid-template-columns:1fr}}
  .box{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:
    repeating-conic-gradient(#2a2e38 0 25%,#1d2028 0 50%) 50%/16px 16px}
  .box img{display:block;width:100%;height:auto}
  .cap{font-size:12px;color:var(--mut);margin:0 0 4px}
  .err{color:var(--err);font-size:14px;margin-top:10px;word-break:break-word}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Photoroom Tools</h1>
  <div class="sub">Hapus background &amp; edit foto produk dengan Photoroom API</div>

  <div class="tabs">
    <button class="tab on" data-mode="remove">Hapus Background</button>
    <button class="tab" data-mode="edit">Edit Produk</button>
  </div>

  <div class="card">
    <div class="drop" id="drop">Ketuk / seret gambar ke sini<br><small>JPG, PNG, WEBP</small></div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <!-- Opsi: Hapus Background -->
  <div class="card" id="opt-remove">
    <div class="row">
      <div style="flex:1;min-width:140px">
        <label style="margin-top:0">Format hasil</label>
        <select id="r-format"><option value="png">PNG (transparan)</option><option value="webp">WEBP</option><option value="jpg">JPG</option></select>
      </div>
      <div>
        <label style="margin-top:0">Warna latar</label>
        <div class="row"><input type="checkbox" id="r-usebg"><input type="color" id="r-bg" value="#ffffff"></div>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="r-crop"> Crop pas ke objek</label>
    <div class="hint">Warna latar &amp; format JPG: transparansi diganti warna terpilih.</div>
  </div>

  <!-- Opsi: Edit Produk -->
  <div class="card hide" id="opt-edit">
    <label style="margin-top:0">Latar belakang</label>
    <select id="e-bgtype">
      <option value="color">Warna polos</option>
      <option value="transparent">Transparan</option>
      <option value="ai">Generate dengan AI (prompt)</option>
    </select>
    <div id="e-colorrow" style="margin-top:8px"><input type="color" id="e-bg" value="#ffffff"></div>
    <input type="text" id="e-prompt" class="hide" placeholder="contoh: meja kayu di dapur modern, cahaya pagi" style="margin-top:8px">
    <label class="chk"><input type="checkbox" id="e-shadow" checked> Bayangan AI (lembut)</label>
    <label class="chk"><input type="checkbox" id="e-relight"> Perbaiki pencahayaan</label>
    <label>Padding: <span id="e-padv">9</span>%</label>
    <input type="range" id="e-pad" min="0" max="30" value="9">
    <label>Format hasil</label>
    <select id="e-format"><option value="webp">WEBP</option><option value="png">PNG</option><option value="jpg">JPG</option></select>
    <div class="hint">Mode ini butuh plan <b>Plus</b> di Photoroom (1 panggilan = 5 kredit Basic).</div>
  </div>

  <button class="go" id="go" disabled>Proses</button>
  <div class="err hide" id="err"></div>

  <div class="card hide" id="result" style="margin-top:12px">
    <div class="cmp">
      <div><p class="cap">Asli</p><div class="box"><img id="img-before" alt=""></div></div>
      <div><p class="cap">Hasil</p><div class="box"><img id="img-after" alt=""></div></div>
    </div>
    <a class="dl" id="dl" download="photoroom-result.png">Download hasil</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let mode = 'remove', srcData = null;

// Tab
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  mode = t.dataset.mode;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('#opt-remove').classList.toggle('hide', mode !== 'remove');
  $('#opt-edit').classList.toggle('hide', mode !== 'edit');
});

// Edit options UI
$('#e-bgtype').onchange = e => {
  $('#e-colorrow').classList.toggle('hide', e.target.value !== 'color');
  $('#e-prompt').classList.toggle('hide', e.target.value !== 'ai');
};
$('#e-pad').oninput = e => $('#e-padv').textContent = e.target.value;

// Upload
const drop = $('#drop'), file = $('#file');
drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && load(file.files[0]);

function showErr(m){ const e = $('#err'); e.textContent = m; e.classList.toggle('hide', !m); }

// Perkecil gambar supaya muat batas 4.5MB body Vercel
function load(f) {
  showErr('');
  if (!f.type.startsWith('image/')) return showErr('File harus gambar');
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    const MAX = 2000;
    const s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    srcData = c.toDataURL('image/jpeg', 0.92);
    URL.revokeObjectURL(url);
    drop.innerHTML = '✓ ' + (f.name || 'gambar') + '<br><small>ketuk untuk ganti</small>';
    $('#go').disabled = false;
    $('#result').classList.add('hide');
  };
  img.onerror = () => showErr('Gambar tidak bisa dibaca');
  img.src = url;
}

// Proses
$('#go').onclick = async () => {
  if (!srcData) return;
  showErr('');
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Memproses...';
  let options;
  if (mode === 'remove') {
    options = {
      format: $('#r-format').value,
      crop: $('#r-crop').checked,
      bgColor: $('#r-usebg').checked ? $('#r-bg').value : undefined,
    };
  } else {
    options = {
      bgType: $('#e-bgtype').value,
      bgColor: $('#e-bg').value,
      bgPrompt: $('#e-prompt').value,
      shadow: $('#e-shadow').checked,
      relight: $('#e-relight').checked,
      padding: $('#e-pad').value / 100,
      format: $('#e-format').value,
    };
  }
  try {
    const r = await fetch('/api/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: srcData, mode, options }),
    });
    const text = await r.text();
    let j; try { j = JSON.parse(text); } catch { j = { error: r.status === 413 ? 'Gambar terlalu besar' : 'Respon server tidak valid (' + r.status + ')' }; }
    if (!r.ok || !j.image) throw new Error(j.error || 'Gagal memproses');
    $('#img-before').src = srcData;
    $('#img-after').src = j.image;
    const ext = (j.image.match(/^data:image\/(\w+)/) || [, 'png'])[1].replace('jpeg', 'jpg');
    const dl = $('#dl'); dl.href = j.image; dl.download = 'photoroom-result.' + ext;
    $('#result').classList.remove('hide');
    $('#result').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    showErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Proses';
  }
};
</script>
</body>
</html>
