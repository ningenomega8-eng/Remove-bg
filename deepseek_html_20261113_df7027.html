<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1a1f">
<title>Remove background by Ningen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c1a1f;
    --apricot:#ff5c70;
    --text:#f1f6f5;
    --mut:rgba(241,246,245,.64);
    --glass:rgba(255,255,255,.085);
    --glass-in:rgba(255,255,255,.07);
    --edge:rgba(255,255,255,.2);
    --err:#ffb4a2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ink)}
  body{
    margin:0;min-height:100vh;color:var(--text);
    font-family:'Zen Maru Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:500;line-height:1.55;overflow-x:hidden;
  }
  .bgvideo{position:fixed;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;background:var(--ink)}
  .scrim{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,14,.5),rgba(8,10,14,.62))}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 40px}
  header{margin:6px 4px 22px}
  h1{margin:0;font-size:clamp(40px,12vw,58px);font-weight:900;letter-spacing:-.02em;line-height:1}
  .tool{margin:6px 0 0;font-size:clamp(20px,5.5vw,26px);font-weight:500;color:var(--mut);letter-spacing:.01em}
  .lead{margin:14px 0 0;max-width:34ch;color:var(--mut);font-size:15px}
  .glass{
    background:var(--glass);
    border:1px solid var(--edge);
    border-radius:26px;
    padding:16px;
    margin-bottom:14px;
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .tabs{display:flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .tab{flex:1;padding:10px 8px;border:0;border-radius:999px;background:transparent;color:var(--mut);font:inherit;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
  .tab.on{background:rgba(255,255,255,.9);color:var(--ink)}
  .drop{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
    min-height:150px;padding:20px 12px;border:1.5px dashed rgba(255,255,255,.38);border-radius:18px;
    background:var(--glass-in);color:var(--text);font:inherit;text-align:center;cursor:pointer;transition:border-color .2s,background .2s
  }
  .drop:hover,.drop.over{border-color:var(--apricot);background:rgba(255,92,112,.14)}
  .drop b{font-size:17px;font-weight:700}
  .drop small{color:var(--mut);font-size:13px}
  .drop.has{min-height:0;padding:14px;flex-direction:row;gap:10px}
  .drop.has b{font-size:15px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
  label:first-child{margin-top:0}
  select,input[type=text]{
    width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--edge);
    background:var(--glass-in);color:var(--text);font:inherit;font-weight:500
  }
  select option{background:#12262c;color:var(--text)}
  input::placeholder{color:rgba(241,246,245,.4)}
  input[type=color]{width:48px;height:38px;border:1px solid var(--edge);border-radius:10px;background:var(--glass-in);padding:3px;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--apricot)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--apricot);flex:none}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .grow{flex:1;min-width:150px}
  .chk{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px;color:var(--text)}
  .hint{margin:12px 0 0;font-size:13px;color:var(--mut)}
  .hide{display:none!important}
  button.go{
    width:100%;padding:15px;border:0;border-radius:16px;background:var(--apricot);color:var(--ink);
    font:inherit;font-weight:900;font-size:16px;cursor:pointer;
    box-shadow:0 12px 28px -12px rgba(255,92,112,.85);transition:transform .15s,filter .2s
  }
  button.go:active{transform:scale(.985)}
  button.go:disabled{background:rgba(255,255,255,.14);color:var(--mut);box-shadow:none;cursor:not-allowed}
  button.go.busy{cursor:progress}
  .err{margin:12px 4px 0;color:var(--err);font-size:14px;word-break:break-word}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.cmp{grid-template-columns:1fr}}
  .cap{margin:0 0 6px 2px;font-size:13px;color:var(--mut)}
  .box{border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:rgba(0,0,0,.2)}
  .box.chk-bg{background:repeating-conic-gradient(rgba(255,255,255,.16) 0 25%,rgba(255,255,255,.05) 0 50%) 50%/18px 18px}
  .box img{display:block;width:100%;height:auto}
  a.dl{
    display:block;margin-top:12px;padding:14px;border-radius:16px;text-align:center;text-decoration:none;
    background:rgba(255,255,255,.92);color:var(--ink);font-weight:900
  }
  :focus-visible{outline:2px solid var(--apricot);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.bgvideo{display:none}*{transition:none!important}}
</style>
</head>
<body>
<video class="bgvideo" src="bg.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
<div class="scrim" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>Remove background</h1>
    <p class="tool">by Ningen</p>
    <p class="lead">Hapus latar belakang foto dalam hitungan detik, lalu unduh hasilnya.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab on" data-mode="remove" role="tab">Hapus background</button>
    <button class="tab" data-mode="edit" role="tab">Edit produk</button>
  </div>

  <div class="glass">
    <button type="button" class="drop" id="drop">
      <b>Pilih foto</b>
      <small>atau seret ke sini. JPG, PNG, WEBP</small>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="glass" id="opt-remove">
    <div class="row">
      <div class="grow">
        <label for="r-format">Format hasil</label>
        <select id="r-format">
          <option value="png">PNG (transparan)</option>
          <option value="webp">WEBP</option>
          <option value="jpg">JPG</option>
        </select>
      </div>
      <div>
        <label for="r-bg">Ganti dengan warna</label>
        <div class="row" style="align-items:center;gap:10px">
          <input type="checkbox" id="r-usebg" aria-label="Pakai warna latar">
          <input type="color" id="r-bg" value="#ffffff">
        </div>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="r-crop"> Potong pas ke objek</label>
  </div>

  <div class="glass hide" id="opt-edit">
    <label for="e-bgtype">Latar belakang</label>
    <select id="e-bgtype">
      <option value="color">Warna polos</option>
      <option value="transparent">Transparan</option>
      <option value="ai">Buat dengan AI dari deskripsi</option>
    </select>
    <div id="e-colorrow" style="margin-top:10px"><input type="color" id="e-bg" value="#ffffff" aria-label="Warna latar"></div>
    <input type="text" id="e-prompt" class="hide" placeholder="Contoh: meja kayu di dapur modern, cahaya pagi" style="margin-top:10px" aria-label="Deskripsi latar">
    <label class="chk"><input type="checkbox" id="e-shadow" checked> Bayangan lembut</label>
    <label class="chk"><input type="checkbox" id="e-relight"> Perbaiki pencahayaan</label>
    <label for="e-pad">Jarak tepi: <span id="e-padv">9</span>%</label>
    <input type="range" id="e-pad" min="0" max="30" value="9">
    <label for="e-format">Format hasil</label>
    <select id="e-format">
      <option value="webp">WEBP</option>
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
    </select>  </div>

  <div class="glass">
    <label for="k-mode">Mode hasil</label>
    <select id="k-mode">
      <option value="live">Biasa</option>
      <option value="sandbox">Uji coba</option>
    </select>
    <p class="hint" id="k-hint">Hasil bersih tanpa watermark.</p>
  </div>

  <button class="go" id="go" disabled>Pilih foto dulu</button>
  <div class="err hide" id="err" role="alert"></div>

  <div class="glass hide" id="result" style="margin-top:14px">
    <div class="cmp">
      <div><p class="cap">Asli</p><div class="box"><img id="img-before" alt="Foto asli"></div></div>
      <div><p class="cap">Hasil</p><div class="box chk-bg"><img id="img-after" alt="Hasil"></div></div>
    </div>
    <a class="dl" id="dl" download="ningen-result.png">Unduh hasil</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let mode = 'remove', srcData = null;

const goLabel = () => mode === 'remove' ? 'Hapus background' : 'Proses foto';
const idleLabel = () => srcData ? goLabel() : 'Pilih foto dulu';

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  mode = t.dataset.mode;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('#opt-remove').classList.toggle('hide', mode !== 'remove');
  $('#opt-edit').classList.toggle('hide', mode !== 'edit');
  $('#go').textContent = idleLabel();
});

$('#e-bgtype').onchange = e => {
  $('#e-colorrow').classList.toggle('hide', e.target.value !== 'color');
  $('#e-prompt').classList.toggle('hide', e.target.value !== 'ai');
};
$('#e-pad').oninput = e => $('#e-padv').textContent = e.target.value;

const kMode = $('#k-mode');
function syncKMode() {
  $('#k-hint').textContent = kMode.value === 'sandbox'
    ? 'Gratis untuk uji coba, hasil diberi watermark.'
    : 'Hasil bersih tanpa watermark.';
}
try { const saved = localStorage.getItem('ningen-kmode'); if (saved === 'sandbox' || saved === 'live') kMode.value = saved; } catch (_) {}
syncKMode();
kMode.onchange = () => {
  syncKMode();
  try { localStorage.setItem('ningen-kmode', kMode.value); } catch (_) {}
};

const drop = $('#drop'), file = $('#file');
drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
};
file.onchange = () => file.files[0] && load(file.files[0]);

function showErr(m){ const e = $('#err'); e.textContent = m; e.classList.toggle('hide', !m); }

function load(f) {
  showErr('');
  if (!f.type.startsWith('image/')) return showErr('File harus berupa gambar (JPG, PNG, atau WEBP).');
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    const MAX = 2000;
    const s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    srcData = c.toDataURL('image/jpeg', 0.92);
    URL.revokeObjectURL(url);
    drop.classList.add('has');
    drop.innerHTML = '<b></b><small>ketuk untuk ganti</small>';
    drop.querySelector('b').textContent = f.name || 'Foto dipilih';
    $('#go').disabled = false;
    $('#go').textContent = idleLabel();
    $('#result').classList.add('hide');
  };
  img.onerror = () => showErr('Foto tidak bisa dibaca. Coba file lain.');
  img.src = url;
}

// Otomatis deteksi & tutup watermark dengan teks "Ningen"
async function stampNingen(dataUrl) {
  const img = new Image();
  img.src = dataUrl;
  await img.decode();

  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const W = img.width, H = img.height;
  const data = ctx.getImageData(0, 0, W, H).data;

  // Scan 35% area bawah: cari piksel terang (watermark putih) yang kontras dengan sekitarnya
  const scanTop = Math.floor(H * 0.65);
  let minX = W, minY = H, maxX = 0, maxY = 0, found = 0;

  for (let y = scanTop; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const a = data[i+3];
      if (a < 200) continue;
      const lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      if (lum > 235) {
        let contrast = 0;
        for (let dy = -3; dy <= 3; dy += 3) {
          for (let dx = -3; dx <= 3; dx += 3) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const j = (ny * W + nx) * 4;
            const nl = 0.299*data[j] + 0.587*data[j+1] + 0.114*data[j+2];
            if (lum - nl > 40) contrast++;
          }
        }
        if (contrast >= 2) {
          found++;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
    }
  }

  if (found > 80 && maxX > minX && maxY > minY) {
    const pad = Math.max(6, Math.round(H * 0.008));
    const bx = Math.max(0, minX - pad);
    const by = Math.max(0, minY - pad);
    const bw = Math.min(W - bx, (maxX - minX) + pad * 2);
    const bh = Math.min(H - by, (maxY - minY) + pad * 2);

    const sx = Math.max(0, Math.round(bx) - 3);
    const sy = Math.max(0, Math.round(by) - 3);
    const sample = ctx.getImageData(sx, sy, 1, 1).data;
    ctx.fillStyle = `rgb(${sample[0]},${sample[1]},${sample[2]})`;
    ctx.fillRect(bx, by, bw, bh);

    const fontSize = Math.max(12, Math.round(bh * 0.75));
    ctx.font = `900 ${fontSize}px 'Zen Maru Gothic', sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText('Ningen', bx + bw / 2, by + bh / 2);
  }

  return c.toDataURL('image/png');
}

$('#go').onclick = async () => {
  if (!srcData) return;
  showErr('');
  const btn = $('#go');
  btn.disabled = true; btn.classList.add('busy'); btn.textContent = 'Sedang memproses...';
  let options;
  if (mode === 'remove') {
    options = {
      format: $('#r-format').value,
      crop: $('#r-crop').checked,
      bgColor: $('#r-usebg').checked ? $('#r-bg').value : undefined,
    };
  } else {
    options = {
      bgType: $('#e-bgtype').value,
      bgColor: $('#e-bg').value,
      bgPrompt: $('#e-prompt').value,
      shadow: $('#e-shadow').checked,
      relight: $('#e-relight').checked,
      padding: $('#e-pad').value / 100,
      format: $('#e-format').value,
    };
  }
  options.sandbox = kMode.value === 'sandbox';
  try {
    const r = await fetch('/api/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: srcData, mode, options }),
    });
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); }
    catch { j = { error: r.status === 413 ? 'Foto terlalu besar. Pilih foto yang lebih kecil.' : 'Server tidak merespons dengan benar (kode ' + r.status + ').' }; }
    if (!r.ok || !j.image) throw new Error(j.error || 'Gagal memproses foto.');
    $('#img-before').src = srcData;

    const stamped = await stampNingen(j.image);
    $('#img-after').src = stamped;

    const dl = $('#dl');
    dl.href = stamped;
    dl.download = 'ningen-result.png';

    $('#result').classList.remove('hide');
    $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    showErr(e.message);
  } finally {
    btn.disabled = false; btn.classList.remove('busy'); btn.textContent = idleLabel();
  }
};
</script>
</body>
</html>
